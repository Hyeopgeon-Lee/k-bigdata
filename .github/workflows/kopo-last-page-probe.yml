name: KOPO official board last page probe
on:
  push:
    branches: [main]
    paths:
      - 'tools/kopo_last_page_probe.py'
      - '.github/workflows/kopo-last-page-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/kopo_last_page_probe.py
