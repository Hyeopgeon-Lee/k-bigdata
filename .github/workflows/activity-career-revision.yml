name: 학과 활동 취업 연계 문구 286건 정비
on:
  push:
    branches: [feature/activities-career-editorial-20261025]
    paths:
      - '.github/workflows/activity-career-revision.yml'
      - 'tools/rewrite_activity_career_context.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activities-career-editorial-20261025
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revise career/portfolio paragraphs article-by-article
        run: python tools/rewrite_activity_career_context.py
      - name: Check Python, JavaScript and build
        run: |
          python -m py_compile tools/rewrite_activity_career_context.py tools/standardize_activity_editorial.py tools/activity_promo.py
          node --check activity-pagination.js
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit reviewed activity articles
        run: |
          git config user.name 'k-bigdata-site-bot'
          git config user.email 'site-bot@users.noreply.github.com'
          git add activities/ reports/activity_career_context_review_2026-10-25.md data/activity_career_context_review_2026-10-25.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect each activity to employment, verifiable portfolio and interview preparation"
          git pull --rebase origin feature/activities-career-editorial-20261025
          git push origin HEAD:feature/activities-career-editorial-20261025
