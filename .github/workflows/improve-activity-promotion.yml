name: 학과 활동 321건 홍보용 콘텐츠 1차 정비
on:
  push:
    branches: [main]
    paths:
      - tools/improve_activity_promotion.py
      - .github/workflows/improve-activity-promotion.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-revisions-activities
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Improve factual titles, historical notes, leads and SEO across 321 posts
        run: python tools/improve_activity_promotion.py
      - name: Build and validate all pages metadata and links
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit published article revisions and review report
        run: |
          git config user.name "k-bigdata-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add activities/ reports/activity_promotion_edits_2026-10-25.md data/activity_promotion_edits_2026-10-25.json
          git commit -m "Improve 321 department news articles: factual introductions, metadata, dated notices"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy refreshed content
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
