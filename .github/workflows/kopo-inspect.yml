name: KOPO 학과 게시판 상세보기 진단
on:
  push:
    branches: [main]
    paths:
      - 'tools/kopo_inspect.py'
      - '.github/workflows/kopo-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/kopo_inspect.py
