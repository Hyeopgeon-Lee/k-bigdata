name: Activity promotion regression check
on:
  push:
    branches:
      - feature/activities-promo-20261025
  pull_request:
    paths:
      - 'tools/activity_promo.py'
      - 'tools/build_site.py'
      - 'tools/test_site.py'
      - 'activity-pagination.js'
      - 'activities.css'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and client script checks
        run: |
          python -m py_compile tools/activity_promo.py tools/build_site.py tools/test_site.py
          node --check activity-pagination.js
      - name: Compile static site without live API fetches
        run: OFFLINE_BUILD=1 python tools/build_site.py
      - name: Run existing site checks plus editorial and UI regression tests
        run: python tools/test_site.py
