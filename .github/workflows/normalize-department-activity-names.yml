name: 학과 활동 게시글 옛 학과명 일괄 정정
on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize_department_activity_names.py'
      - '.github/workflows/normalize-department-activity-names.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: department-name-activity-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct all archived activity articles and metadata
        run: python tools/normalize_department_activity_names.py
      - name: Validate source and published names and links
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit updated pages
        id: commit
        run: |
          git config user.name "k-bigdata-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add activities/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All activity posts were already standardized"
          else
            git commit -m "Standardize historical department names throughout activity posts"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy standardized site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
