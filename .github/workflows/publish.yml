name: 학과 홈페이지 자동 발행

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *' # KST 00:37, without creating Git commits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 최적화 이미지 생성 라이브러리
        run: python -m pip install Pillow==11.3.0
      - name: 8317·8318호 독립 GLB 모델 생성
        run: |
          python -m pip install 'trimesh==4.11.1' 'numpy>=1.26,<3'
          python tools/build_room8317.py
          python tools/build_room8318.py
          python -c "import trimesh; s=trimesh.load('tour/models/room-8318.glb',force='scene'); assert len(s.geometry)>=18; assert sum(len(m.faces) for m in s.geometry.values()) > 3500"
          python -c "import trimesh; s=trimesh.load('tour/models/room-8317.glb',force='scene'); assert len(s.geometry)>=15; assert sum(len(m.faces) for m in s.geometry.values()) > 5000"
      - name: 기존 글·입시 검증
        run: |
          python tools/generate_post.py --check
          python tools/test_insights.py
          node tools/test_admission.cjs
          node tools/test_analytics.cjs
          node tools/test_analytics_loader.cjs
          node tools/test_lazy_video_poster.cjs
          node --check tour/world.js
          node --check tour/tour.js
          node --check tour/world-v2.js
          node --check tour/tour-v2.js
      - uses: actions/configure-pages@v5
      - name: 모집정보·검색 콘텐츠 정적 빌드
        run: |
          python tools/build_site.py
          test -s _site/tour/models/room-8317.glb
          test -s _site/tour/room-8317.html
          test -s _site/tour/models/room-8318.glb
          test -s _site/tour/room-8318.html
      - name: SEO·RSS·개인정보·링크 검사 (실패 시 배포 중단)
        run: python tools/test_site.py
      - name: 모바일 활동 목록 12건 단위 정적 분할 및 이미지 치수 보완
        run: python tools/optimize_archive.py
      - name: 최적화된 공개 홈페이지·정적 페이지 회귀 검증
        run: python tools/test_archive_pagination.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
  notify-indexnow:
    name: Bing·IndexNow 검색엔진 알림
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 배포된 사이트맵·키 확인 후 전체 URL 알림
        run: python tools/notify_indexnow.py
