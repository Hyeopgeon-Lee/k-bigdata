name: 학과 홈페이지 자동 발행

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *' # KST 00:37, without creating Git commits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 최적화 이미지 생성 라이브러리
        run: python -m pip install Pillow==11.3.0
      - name: 기존 글·입시 검증
        run: |
          python tools/generate_post.py --check
          python tools/test_insights.py
          node tools/test_admission.cjs
          node tools/test_analytics.cjs
          node tools/test_analytics_loader.cjs
          node tools/test_lazy_video_poster.cjs
      - uses: actions/configure-pages@v5
      - name: 모집정보·검색 콘텐츠 정적 빌드
        run: python tools/build_site.py
      - name: SEO·RSS·개인정보·링크 검사 (실패 시 배포 중단)
        run: python tools/test_site.py
      - name: 모바일 활동 목록 12건 단위 정적 분할 및 이미지 치수 보완
        run: python tools/optimize_archive.py
      - name: 최적화된 공개 홈페이지·정적 페이지 회귀 검증
        run: python tools/test_archive_pagination.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 오래된 Pages 배포 잠금 해제 확인
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_PAGES_SHA: 9dd16a0a66fc7673cf3d05f1612374533a2582c6
        run: |
          set -euo pipefail
          api_path="repos/${GITHUB_REPOSITORY}/pages/deployments/${OLD_PAGES_SHA}"
          if status="$(gh api "$api_path" --jq '.status' 2>&1)"; then
            echo "Earlier Pages deployment status: $status"
            case "$status" in
              succeed|failed|canceled|cancelled)
                echo "Older deployment is already finished"
                ;;
              *)
                echo "Cancelling stalled older Pages deployment: $OLD_PAGES_SHA"
                gh api -X POST "$api_path/cancel"
                ;;
            esac
          else
            echo "::warning::Pages status query unavailable: $status"
          fi
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
  notify-indexnow:
    name: Bing·IndexNow 검색엔진 알림
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 배포된 사이트맵·키 확인 후 전체 URL 알림
        run: python tools/notify_indexnow.py
