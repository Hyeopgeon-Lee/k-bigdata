name: 학과 홈페이지 자동 발행

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *' # KST 00:37, without creating Git commits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 기존 글·입시 검증
        run: |
          python tools/generate_post.py --check
          python tools/test_insights.py
          node tools/test_admission.cjs
          node tools/test_analytics.cjs
      - uses: actions/configure-pages@v5
      - name: 모집정보·검색 콘텐츠 정적 빌드
        run: python tools/build_site.py
      - name: SEO·RSS·개인정보·링크 검사 (실패 시 배포 중단)
        run: python tools/test_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
  notify-indexnow:
    name: Bing·IndexNow 검색엔진 알림
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 배포된 사이트맵·키 확인 후 전체 URL 알림
        run: python tools/notify_indexnow.py
