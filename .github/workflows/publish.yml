name: 학과 홈페이지 자동 발행

on:
  push:
    branches: [main]
  schedule:
    # 한국시간 월·수·금 오전 6시 = UTC 일·화·목 오후 9시
    - cron: "0 21 * * 0,2,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 최신 AI·IT 기사로 새 글 만들기
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/generate_post.py

      - name: 새 글 저장하기
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "k-bigdata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "새 AI·IT 인사이트 자동 발행"
          git push

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 홈페이지 묶음 만들기
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
