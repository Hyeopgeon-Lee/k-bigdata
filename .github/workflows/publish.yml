name: 학과 홈페이지 자동 발행

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인사이트 품질 검사
        run: |
          python tools/generate_post.py --check
          python tools/test_insights.py
          node tools/test_admission.cjs

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 검색 가능한 정적 홈페이지 만들기
        run: python tools/build_site.py

      - name: 홈페이지 묶음 만들기
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 게시
        id: deployment
        uses: actions/deploy-pages@v4
