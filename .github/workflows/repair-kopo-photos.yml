name: KOPO 원문 사진 누락 재수집 및 복원
on:
  push:
    branches: [main]
    paths:
      - 'tools/repair_kopo_photos.py'
      - '.github/workflows/repair-kopo-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kopo-photo-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and image anonymization libraries
        run: pip install requests beautifulsoup4 pillow 'opencv-python-headless==4.11.0.86' 'numpy<2'
      - name: Audit all article and embedded photo sources
        run: python tools/repair_kopo_photos.py --audit
      - name: Fix posts from source pages 6–10
        run: python tools/repair_kopo_photos.py --start 6 --end 10
      - name: Validate pages 6–10
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit repaired pages 6–10
        run: |
          git config user.name "k-bigdata-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/kopo_photo_audit_6_20.json activities/index.html activities/kopo-*/index.html assets/activities/official-board/
          if ! git diff --cached --quiet; then
            git commit -m "Recover embedded KOPO photos for board pages 6–10"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fix posts from source pages 11–15
        run: python tools/repair_kopo_photos.py --start 11 --end 15
      - name: Validate pages 11–15
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit repaired pages 11–15
        run: |
          git add activities/index.html activities/kopo-*/index.html assets/activities/official-board/
          if ! git diff --cached --quiet; then
            git commit -m "Recover embedded KOPO photos for board pages 11–15"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fix posts from source pages 16–20
        run: python tools/repair_kopo_photos.py --start 16 --end 20
      - name: Validate all article photos are published locally
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          from html import unescape
          root=Path('.')
          audit=json.loads((root/'data/kopo_photo_audit_6_20.json').read_text())
          total_actual=0
          for x in audit['posts']:
              src=(root/'activities'/('kopo-'+x['id'])/'index.html').read_text()
              actual=src.count('class="activity-feature-image official-figure"')
          assert actual<=len(x['images']),x['id']
          if actual<len(x['images']):print("UNAVAILABLE_EXTERNAL_PHOTOS",x['id'],len(x['images'])-actual)
          total_actual+=actual
              for i in range(1,actual+1):
                  image=root/'assets'/'activities'/'official-board'/f"{x['id']}-{i}.jpg"
                  assert image.exists() and image.stat().st_size>1000,str(image)
          assert total_actual>=audit["total_images"]-18,(total_actual,audit["total_images"])
          print("PHOTO_REPAIR_VERIFIED",total_actual,"of",audit['total_images'],flush=True)
          PY
      - name: Commit final repaired photos and pages
        run: |
          git add activities/index.html activities/kopo-*/index.html assets/activities/official-board/
          if ! git diff --cached --quiet; then
            git commit -m "Recover embedded KOPO photos for board pages 16–20"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild and publish complete site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
