          if ! git diff --cached --quiet; then
            git commit -m "Restore original unmosaiced department images late-29_32"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify all KOPO archive image links use source originals
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path(".")
          idx=(root/"activities"/"index.html").read_text()
          assert idx.count('class="activity-card"')==321
          for path in (root/"activities").rglob("index.html"):
              if path.parent.name in ("social-data-career-trends","gangseo-job-fair-2026"):continue
              assert not re.search(r'/assets/activities/official-board/\d+-\d+\.jpg',path.read_text()),path
          original=list((root/"assets"/"activities"/"official-original").glob("*.jpg"))
          assert len(original)>450,len(original)
          print("VERIFIED_UNMOSAICED_SOURCE_IMAGES",len(original))
          PY
      - name: Publish changed images and pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
