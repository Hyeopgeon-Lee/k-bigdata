name: 학과 활동 사진 원본으로 복원
on:
  push:
    branches: [main]
    paths:
      - tools/restore_activity_source_images.py
      - .github/workflows/restore-activity-source-images.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: activity-restore-originals
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install requests beautifulsoup4 pillow 'opencv-python-headless==4.11.0.86' 'numpy<2'
      - name: Restore early
        run: python tools/restore_activity_source_images.py --group early
      - name: Validate early
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
      - name: Commit early
        run: |
          git config user.name "k-bigdata-site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add activities/ assets/activities/official-original/
          if ! git diff --cached --quiet; then
            git commit -m "Restore original unmosaiced department images early"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Restore mid-6_10
        run: python tools/restore_activity_source_images.py --group mid-6_10
      - name: Validate mid-6_10
        run: |
          OFFLINE_BUILD=1 python tools/build_site.py
          python tools/test_site.py
