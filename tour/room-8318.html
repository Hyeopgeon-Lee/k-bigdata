  *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#e4e8eb;font-family:system-ui,'Pretendard',sans-serif;color:#edf5fa}
  #view{position:fixed;inset:0;touch-action:none}
  .toolbar{position:fixed;top:0;left:0;right:0;padding:22px clamp(16px,3.4vw,50px);background:linear-gradient(180deg,#0a2035f0,#0a203500);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none}

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"}}</script>

<body>
<div id="view" aria-label="8318호 회의실 GLB 모델 360도 화면"></div>
<div class="toolbar">
 <div><p class="tag">ROOM 8318 · PROJECT MEETING · 3D MODEL</p><h1>8318호 회의실</h1><p style="font-size:12px;color:#cfdfeb">가구 반입 전 사진과 계획 배치에 맞춰 제작한 10인 회의실</p></div>
 <a href="/tour/">전체 학과 메타버스로 ↗</a>
</div>
<div class="note"><strong>조작:</strong> 드래그하여 360도 회전 · 두 손가락/휠로 확대·축소<br>이 모델은 가구 반입 전 실내 사진과 예정된 10인용 배치를 활용한 시안입니다. 실제 가구 디자인 및 치수는 확정되지 않았습니다.</div>
<div class="buttons"><button id="perspective">전체 조감도</button><button id="entrance">입구에서 보기</button><button id="table">10인용 타원형 탁자</button><button id="whiteboard">매립형 화이트보드</button><button id="screen" aria-pressed="false">전동 스크린 내리기</button></div>
<div class="status" id="loading">8318호 GLB 모델을 불러오는 중입니다…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvasRoot=document.getElementById('view');
const scene=new THREE.Scene();scene.background=new THREE.Color('#dce5eb');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.07,200);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.65;
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);canvasRoot.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf8faff,0xb0bbcc,2.7));
const sun=new THREE.DirectionalLight(0xfff4e9,2.6);sun.position.set(-7,13,10);scene.add(sun);
for(const [x,z] of [[0,0],[2,2],[-3,-2]]){
 const l=new THREE.PointLight(0xffefda,8,13,2);l.position.set(x,3,z);scene.add(l);
}
const control=new OrbitControls(camera,renderer.domElement);
control.enableDamping=true;control.dampingFactor=.055;control.minDistance=2.5;control.maxDistance=31;
control.maxPolarAngle=Math.PI*.49;control.target.set(0,1.30,0);
let model=null,screenDown=false;
function setScreen(down){screenDown=down;for(const name of ['8318_projector_screen_lowered','8318_screen_weight_bar']){const part=model?.getObjectByName(name);if(part)part.visible=down;}const btn=document.getElementById('screen');btn.setAttribute('aria-pressed',String(down));btn.textContent=down?'전동 스크린 올리기':'전동 스크린 내리기';}
function cutaway(mode='open'){
 if(!model)return;
 for(const name of ['8318_ceiling','8318_tilejoint']){
   const part=model.getObjectByName(name);if(part)part.visible=false;
 }
 // Full cutaway reveals furniture from all sides; entrance mode keeps walls.
 for(const name of ['8318_wallpaint','8318_plaster','8318_woodwall','8318_frost','8318_glass']){
   const part=model.getObjectByName(name);if(part)part.visible=(mode==='entrance');
 }
}
function view(x,y,z,tx=0,ty=1.2,tz=0){camera.position.set(x,y,z);control.target.set(tx,ty,tz);control.update();}
view(9.1,8.7,7.8);
new GLTFLoader().load('/tour/models/room-8318.glb',g=>{
 g.scene.traverse(n=>{if(n.isMesh)n.receiveShadow=false});
 scene.add(g.scene);
 model=g.scene;cutaway();setScreen(false);
 document.getElementById('loading').classList.add('hidden');
},undefined,err=>{
 console.error(err);
 const load=document.getElementById('loading');
 load.textContent='3D 모델 로딩에 실패했습니다. 네트워크 상태를 확인하거나 새로고침해 주세요.';
});
document.getElementById('perspective').onclick=()=>{cutaway();view(9.1,8.7,7.8)};
document.getElementById('entrance').onclick=()=>{cutaway('entrance');view(-7.1,1.7,0,.2,1.4,0)};
document.getElementById('table').onclick=()=>{cutaway();view(5.1,6.8,6.0,0,.8,0)};
document.getElementById('whiteboard').onclick=()=>{cutaway();view(.3,3.6,5.1,-.3,1.9,-1.6)};
document.getElementById('screen').onclick=()=>{cutaway();setScreen(!screenDown);view(-1.3,2.6,3.7,3.6,2.1,0)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);control.update();renderer.render(scene,camera)}animate();
</script>
</body>
