<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="한국폴리텍대학 서울강서캠퍼스 8317호 휴게실의 실제 촬영 사진 기반 GLB 3D 공간 모델. 360도 회전, 확대, 출입구 기준 보기.">
  <meta name="theme-color" content="#0c1a28">
  <title>8317호 휴게실 · GLB 모델 360도 미리보기</title>
  <link rel="canonical" href="https://ai.k-bigdata.kr/tour/room-8317.html">
  <style>
  *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#e4e8eb;font-family:system-ui,'Pretendard',sans-serif;color:#edf5fa}
  #view{position:fixed;inset:0;touch-action:none}
  .toolbar{position:fixed;top:0;left:0;right:0;padding:22px clamp(16px,3.4vw,50px);background:linear-gradient(180deg,#0a2035f0,#0a203500);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none}
  h1{font-size:clamp(18px,2.5vw,28px);letter-spacing:-.035em;line-height:1.3;margin:3px 0 6px}
  p{margin:0;line-height:1.7}
  .tag{font-size:10px;color:#84e7f5;letter-spacing:.16em;font-weight:800}
  .toolbar a,.toolbar button,.buttons button{pointer-events:auto;border:1px solid #d6e5ec73;background:#0c2639df;color:white;text-decoration:none;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;cursor:pointer}
  .buttons{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 20px);width:max-content;display:flex;gap:7px;padding:8px;border-radius:14px;background:#10293fd9;backdrop-filter:blur(12px)}
  .buttons button{white-space:nowrap}.buttons button:hover{background:#235f76}
  .note{position:fixed;left:clamp(16px,3.4vw,50px);bottom:108px;max-width:min(440px,calc(100vw - 32px));padding:12px 15px;border-radius:10px;background:#0c2439e0;color:#d7e5ee;font-size:12px;line-height:1.65}
  .note strong{color:#fff}.status{position:fixed;inset:0;display:grid;place-items:center;background:#0a1a28;color:#fff;z-index:9;font-size:14px;text-align:center;padding:30px}
  .status.hidden{display:none}
  @media(max-width:650px){.toolbar{padding:15px}.toolbar a{font-size:10px;padding:9px}.note{bottom:96px;font-size:11px}.buttons{bottom:15px}.buttons button{padding:11px 9px;font-size:11px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view" aria-label="8317호 휴게실 GLB 모델 360도 화면"></div>
<div class="toolbar">
 <div><p class="tag">ROOM 8317 · 3D MODEL PREVIEW</p><h1>8317호 휴게실</h1><p style="font-size:12px;color:#cfdfeb">실제 사진을 바탕으로 제작한 독립 GLB 모델</p></div>
 <a href="/tour/">전체 학과 메타버스로 ↗</a>
</div>
<div class="note"><strong>조작:</strong> 드래그하여 360도 회전 · 두 손가락/휠로 확대·축소<br>이 모델은 현장 사진·영상 기반의 제작 시안이며, 실측 3D 스캔이 아닙니다.</div>
<div class="buttons"><button id="perspective">전체 조감도</button><button id="entrance">입구에서 보기</button><button id="bench">곡선형 좌석</button><button id="tv">TV·편의시설</button></div>
<div class="status" id="loading">8317호 GLB 모델을 불러오는 중입니다…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvasRoot=document.getElementById('view');
const scene=new THREE.Scene();scene.background=new THREE.Color('#dce5eb');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.07,200);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.65;
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);canvasRoot.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf8faff,0xb0bbcc,2.7));
const sun=new THREE.DirectionalLight(0xfff4e9,2.6);sun.position.set(-7,13,10);scene.add(sun);
for(const [x,z] of [[0,0],[2,2],[-3,-2]]){
 const l=new THREE.PointLight(0xffefda,8,13,2);l.position.set(x,3,z);scene.add(l);
}
const control=new OrbitControls(camera,renderer.domElement);
control.enableDamping=true;control.dampingFactor=.055;control.minDistance=2.5;control.maxDistance=31;
control.maxPolarAngle=Math.PI*.49;control.target.set(0,1.30,0);
function view(x,y,z,tx=0,ty=1.2,tz=0){camera.position.set(x,y,z);control.target.set(tx,ty,tz);control.update();}
view(12.7,10.1,13.5);
new GLTFLoader().load('/tour/models/room-8317.glb',g=>{
 g.scene.traverse(n=>{if(n.isMesh)n.receiveShadow=false});
 scene.add(g.scene);
 document.getElementById('loading').classList.add('hidden');
},undefined,err=>{
 console.error(err);
 const load=document.getElementById('loading');
 load.textContent='3D 모델 로딩에 실패했습니다. 네트워크 상태를 확인하거나 새로고침해 주세요.';
});
document.getElementById('perspective').onclick=()=>view(12.7,10.1,13.5);
document.getElementById('entrance').onclick=()=>view(-9,1.7,.2,2.0,1.4,.0);
document.getElementById('bench').onclick=()=>view(7.6,4.7,8.1,2.8,.8,0);
document.getElementById('tv').onclick=()=>view(-1.2,3.5,7,-2.5,1.5,2.8);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);control.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
